services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: geosegbar-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${DB_PORT}:5433"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - geosegbar-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  geosegbar-api:
    build: .
    container_name: geosegbar-api-dev
    depends_on:
      postgres-dev:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=postgres-dev
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
    env_file:
      - .env
    expose:
      - "9090"
      # Actuator (health, prometheus, info) na porta de management.
      - "8081"
    labels:
      # Lidos pelo Prometheus e pelo Alloy de monitoring/ (docker-compose.dev.yml).
      com.geosegbar.scrape: "true"
      com.geosegbar.service: api
    networks:
      - geosegbar-network
    restart: unless-stopped
    volumes:
      - ./storage/uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://localhost:8081/actuator/health/liveness",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: nginx-dev
    restart: unless-stopped
    ports:
      - "${SERVER_PORT}:80"
    environment:
      - UPSTREAM_SERVER=geosegbar-api:9090
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - geosegbar-network
    depends_on:
      - geosegbar-api
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/nginx-health",
        ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Monitoramento (Prometheus, Grafana, Loki, Tempo, Alloy, exporters) mora em
  # monitoring/. Para subir junto em dev, veja monitoring/docker-compose.dev.yml.

  redis-dev:
    image: redis:7-alpine
    container_name: geosegbar-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy
      allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - geosegbar-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  geosegbar-network:
    # Nome fixo: o compose de monitoring/ entra nesta rede como externa, igual
    # em produção.
    name: geosegbar-network
    driver: bridge

volumes:
  postgres-dev-data:
  redis-dev-data:

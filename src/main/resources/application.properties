spring.application.name=geosegbar-api

# ==============================================
# DATASOURCE CONFIGURATION
# ==============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:geosegbar_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update

# ==============================================
# FLYWAY - MIGRAÇÕES DE BANCO
# ==============================================
# Convivência deliberada com ddl-auto=update. Divisão de trabalho:
#
#   Hibernate (ddl-auto=update) — cria tabelas e colunas novas a partir das
#   entidades, como sempre fez. É o que mantém o banco em dia sem exigir uma
#   migração para cada campo adicionado.
#
#   Flyway — faz o que o Hibernate não faz: remover constraint antiga, migrar
#   dados e reorganizar linhas existentes. É onde mora a separação do catálogo
#   de tipos de instrumento por cliente.
#
# O Flyway roda ANTES do Hibernate no boot. Por isso toda migração é escrita de
# forma condicional: em banco novo (onde as tabelas ainda não existem) ela não
# faz nada e o Hibernate cria o schema já no formato correto a partir das
# entidades; em banco existente ela aplica a mudança.
#
# baseline-on-migrate + baseline-version=0: o banco de produção já tem schema e
# não tem histórico do Flyway. Sem isso o Flyway se recusaria a rodar. Com
# version=0, a migração V1 em diante é aplicada normalmente.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Schema anterior ao Flyway (criado por ddl-auto)
# Uma migração que falha não pode deixar o banco pela metade: o Postgres suporta
# DDL transacional, então o Flyway desfaz tudo daquela migração.
spring.flyway.group=false
spring.flyway.validate-on-migrate=true
# Nunca limpar banco por acidente.
spring.flyway.clean-disabled=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==============================================
# POOL DE CONEXÕES HIKARI
# ==============================================
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=15
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=30000
spring.jpa.properties.hibernate.connection.autocommit=false
spring.transaction.default-timeout=60
spring.datasource.hikari.auto-commit=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# ==============================================
# TOMCAT CONFIGURATION
# ==============================================
server.port=${SERVER_PORT:9090}
# Teto para requisições assíncronas (StreamingResponseBody — o download em ZIP
# do PSB compartilhado). Sem teto, uma leitura travada no S3 seguraria a thread
# do Tomcat para sempre; com o pool em 100, bastariam 100 downloads travados
# para a aplicação parar de atender. 30 minutos acompanha o client_body_timeout
# do nginx e acomoda pasta grande em conexão lenta.
spring.mvc.async.request-timeout=1800000

server.tomcat.max-threads=100
server.tomcat.threads.min-spare=15
server.tomcat.accept-count=100
server.tomcat.max-connections=300
# Timeout da conexão nginx→Tomcat (rede interna, é rápido)
server.tomcat.connection-timeout=30000
server.tomcat.keep-alive-timeout=65000
server.tomcat.max-keep-alive-requests=500
server.tomcat.max-http-header-size=16384
server.tomcat.max-http-post-size=-1
server.tomcat.min-spare-threads=20
server.tomcat.max-swallow-size=-1
server.tomcat.processor-cache=100

# ==============================================
# MULTIPART FILE UPLOAD
# ==============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:500MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:512MB}
spring.servlet.multipart.resolve-lazily=true
spring.servlet.multipart.file-size-threshold=1MB

# ==============================================
# STATIC RESOURCES
# ==============================================
spring.web.resources.add-mappings=false

# ==============================================
# JPA/HIBERNATE
# ==============================================
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.bytecode.use_reflection_optimizer=false
spring.jpa.properties.hibernate.jdbc.time_zone=${TZ:America/Sao_Paulo}
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ==============================================
# SECURITY
# ==============================================
api.security.token.secret=${JWT_SECRET:default_secret_change_this}

# ==============================================
# EMAIL CONFIGURATION
# ==============================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:noreply@localhost}
spring.mail.password=${MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
# Sem timeout, uma conexao SMTP travada prende a thread indefinidamente (o
# pool de e-mail e finito - ver emailExecutor no AsyncConfig).
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
application.log-email=${LOG_EMAIL:joaocaetanodev@gmail.com}
application.support-email=${SUPPORT_EMAIL:support@example.com}

# ==============================================
# FILE STORAGE
# ==============================================
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_BUCKET_NAME:geosegbar-files}
file.base-url=https://${aws.s3.bucket}.s3.${aws.region}.amazonaws.com/

# ==============================================
# FRONTEND
# ==============================================
application.frontend-url=${FRONTEND_URL:http://localhost:3000}
application.system-user-email=${MAIL_USERNAME:noreply@localhost}
application.system-user-password=${SYSTEM_USER_PASSWORD:default_system_user_password}
application.somosdevs-user1-email=${SOMOSDEVS_USER1_EMAIL:default_somosdevs_user1_email}
application.somosdevs-user2-email=${SOMOSDEVS_USER2_EMAIL:default_somosdevs_user2_email}
application.somosdevs-user3-email=${SOMOSDEVS_USER3_EMAIL:default_somosdevs_user3_email}
application.admin-bypass-key=${ADMIN_BYPASS_KEY:default_admin_bypass_key}

# ==============================================
# EXTERNAL API - ANA
# ==============================================
ana.api.identifier=${ANA_API_IDENTIFIER:}
ana.api.password=${ANA_API_PASSWORD:}
ana.api.auth-url=${ANA_API_AUTH_URL:https://www.ana.gov.br/hidrowebservice/EstacoesTelemetricas/OAUth/v1}
ana.api.telemetry-url=${ANA_API_TELEMETRY_URL:https://www.ana.gov.br/hidrowebservice/EstacoesTelemetricas/HidroinfoanaSerieTelemetricaAdotada/v1}

# ==============================================
# REDIS CONFIGURATION
# ==============================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000
# O cliente é o Lettuce (padrão do spring-boot-starter-data-redis). As chaves
# spring.data.redis.jedis.* que existiam aqui não tinham efeito nenhum.

# ==============================================
# HISTORICAL DATA JOB SCHEDULER
# ==============================================
historical-data-job.scheduler.enabled=${HISTORICAL_DATA_JOB_SCHEDULER_ENABLED:true}

# ==============================================
# RATE LIMITING
# ==============================================
rate-limit.enabled=${RATE_LIMIT_ENABLED:false}
rate-limit.public.capacity=${RATE_LIMIT_PUBLIC_CAPACITY:100}
rate-limit.public.refill-tokens=${RATE_LIMIT_PUBLIC_REFILL_TOKENS:100}
rate-limit.public.refill-duration-minutes=${RATE_LIMIT_PUBLIC_REFILL_DURATION:1}
rate-limit.authenticated.capacity=${RATE_LIMIT_AUTH_CAPACITY:500}
rate-limit.authenticated.refill-tokens=${RATE_LIMIT_AUTH_REFILL_TOKENS:500}
rate-limit.authenticated.refill-duration-minutes=${RATE_LIMIT_AUTH_REFILL_DURATION:1}

# ==============================================
# VALIDACAO DE CHECKLIST
# ==============================================
# O app mobile exige observacao no NI ("Nao Inspecionado"); este servidor nunca
# exigiu. Em 28/08/2026, 174 das 236 respostas NI gravadas em producao nao tinham
# observacao — ligar isso passa a recusar a maior parte do que chega hoje.
# So ative depois que mobile e web estiverem exigindo o campo na tela.
checklist.validation.require-observation-on-ni=${CHECKLIST_REQUIRE_OBSERVATION_ON_NI:false}

# ==============================================
# COMPRESSION
# ==============================================
server.compression.enabled=false

# ==============================================
# HTTP CONFIGURATION
# ==============================================
server.tomcat.reject-illegal-header=false
server.tomcat.relaxed-query-chars=|,{,},[,]
server.tomcat.relaxed-path-chars=|,{,},[,]
server.http.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true


# ==============================================
# ACTUATOR — porta de management só interna
# ==============================================
# O actuator escuta numa porta separada da API (8081). O nginx só encaminha a
# 9090, então nada do actuator alcança a internet nem por uma rota errada no
# Apache. Prometheus, HEALTHCHECK do Docker e o gate do deploy chegam pela rede
# interna do Docker. Ver docs/MONITORAMENTO.md.
#
# Exposição mínima: env, configprops, heapdump e afins carregam segredos e não
# são publicados nem nesta porta.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ----------------------------------------------
# Health / Probes — resiliência a dependências externas
# ----------------------------------------------
# O Redis é usado APENAS para rate limiting e degrada de forma fail-open
# (RateLimitService.tryConsume libera as requisições quando o Redis cai).
# Logo, ele NÃO pode ser um gate de health: se o redisHealthIndicator entrasse
# no /actuator/health composto, o Redis fora deixaria o health DOWN (HTTP 503) e
# o orquestrador reiniciaria o container — derrubando a API inteira por causa de
# uma dependência NÃO crítica. Foi exatamente isso que causou a indisponibilidade.
management.health.redis.enabled=false

# Liveness = "o processo está vivo" (nunca deve reiniciar por dependência externa).
# Readiness = pode considerar o banco (tira do balanceador sem matar o container).
# Aponte o healthcheck do orquestrador para /actuator/health/liveness.
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# ----------------------------------------------
# Métricas (Micrometer -> Prometheus)
# ----------------------------------------------
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.tomcat=true
management.metrics.enable.http=true
management.metrics.enable.hikaricp=true

# Sem isto o Tomcat não publica tomcat_threads_busy_threads, que é a medida de
# saturação do pool de requisições.
server.tomcat.mbeanregistry.enabled=true

# Latência das requisições: histograma com faixas explícitas.
#
# Antes havia percentis calculados dentro da JVM (0.5, 0.95, 0.99) mais o
# histograma padrão do Micrometer. Percentil calculado na JVM não soma entre as
# instâncias blue e green, e o histograma padrão gera dezenas de faixas por
# endpoint. Com as 11 faixas abaixo, histogram_quantile() no Prometheus calcula
# p50/p95/p99 de todas as instâncias juntas com uma fração das séries.
management.metrics.distribution.percentiles-histogram.http.server.requests=false
management.metrics.distribution.slo.http.server.requests=10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s,30s

# Tags comuns a todas as métricas
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${SPRING_PROFILES_ACTIVE:dev}

# Versão no ar, publicada como geosegbar_build_info{version=...}. O deploy passa
# o SHA do commit; os painéis marcam cada troca de versão a partir disso.
application.version=${APP_VERSION:dev}

# ----------------------------------------------
# Tracing (Micrometer Tracing -> OTLP -> Alloy -> Tempo)
# ----------------------------------------------
# Desligado por padrão: sem o Alloy no ar, o exportador só acumularia falhas de
# envio no log. O deploy liga (TRACING_ENABLED=true) quando encontra o container
# geosegbar-alloy na rede do Docker.
management.tracing.enabled=${TRACING_ENABLED:false}
# Volume baixo: guarda 100% das requisições. Reduzir aqui se o Tempo crescer além
# do orçamento (docs/MONITORAMENTO.md).
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://geosegbar-alloy:4318/v1/traces}
management.otlp.tracing.compression=gzip
management.otlp.tracing.timeout=5s

# Spans de SQL (datasource-micrometer). Só QUERY: CONNECTION e FETCH geram um
# span por conexão e por result set, o que multiplica o tamanho do trace sem dizer
# nada novo. Valores de parâmetro ficam de fora para não gravar dado de cliente
# no Tempo: a query aparece com "?".
jdbc.includes=QUERY
jdbc.datasource-proxy.include-parameter-values=false

# ==============================================
# Auditoria
# ==============================================
audit.enabled=true
audit.include-get=false
audit.max-body-length=16384
audit.max-stack-trace-length=8000


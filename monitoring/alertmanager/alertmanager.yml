# Alertmanager da API GeoSegBar.
#
# Nenhum segredo neste arquivo: token do bot, chat do Telegram e URL do
# healthchecks.io vêm de compose secrets montados em /run/secrets/
# (ver docs/MONITORAMENTO.md, "Primeira instalação").
#
# Política contra ruído (pedido do João, 26/10/2026): no Telegram, na hora, só
# severity=critical — fora do ar, sobrecarga, segurança e backup. Avisos
# (severity=warning) não mandam mensagem: aparecem no resumo diário das 21h
# (monitoring/report/daily_report.py) e no Grafana. Alerta crítico que continua
# ativo repete a cada 3 horas, não a cada poucos minutos.

global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: telegram-critical
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    # Dead man's switch: o healthchecks.io espera um ping por minuto.
    - matchers:
        - alertname="Watchdog"
      receiver: healthchecks
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

    - matchers:
        - severity="critical"
      receiver: telegram-critical

    # Avisos ficam para o resumo diário.
    - matchers:
        - severity="warning"
      receiver: resumo-diario

inhibit_rules:
  # Com a API fora, latência, SLO e pool viram consequência. Avisa a causa só.
  - source_matchers:
      - alertname="ApiSemColeta"
    target_matchers:
      - alertname=~"SloDisponibilidade.*|LatenciaAlta|EndpointLento|PoolDoBanco.*|ThreadsDoTomcatSaturadas|ExecutorSaturado|HeapAlto"
  # Banco fora explica pool esgotado e erro 5xx.
  - source_matchers:
      - alertname="PostgresFora"
    target_matchers:
      - alertname=~"PoolDoBanco.*|SloDisponibilidade.*|TransacaoLongaNoBanco|ConexoesDoBancoAltas"
  # Mesmo alerta em dois níveis: fica só o crítico.
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname]

receivers:
  - name: telegram-critical
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        parse_mode: HTML
        message: '{{ template "geosegbar.telegram.message" . }}'
        send_resolved: true

  # Sem integração: o aviso fica registrado no Prometheus (série ALERTS), de
  # onde o resumo diário lê o que disparou no dia.
  - name: resumo-diario

  - name: healthchecks
    webhook_configs:
      - url_file: /run/secrets/healthchecks_watchdog_url
        send_resolved: false

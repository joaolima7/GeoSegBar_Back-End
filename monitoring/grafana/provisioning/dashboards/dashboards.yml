# Painéis provisionados do repositório (monitoring/grafana/dashboards/*.json,
# gerados por dashboards-src/build_dashboards.py).
#
# allowUiUpdates: false — o que vale é o arquivo no git. Mudança feita na UI
# seria apagada na próxima recarga; edite o gerador e faça deploy.

apiVersion: 1

providers:
  - name: geosegbar
    orgId: 1
    folder: GeoSegBar
    folderUid: geosegbar
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards/geosegbar
      foldersFromFilesStructure: false

# ==============================================
# PRODUCTION PROFILE
# ==============================================

# Configurações para produção
logging.level.com.geosegbar=INFO
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
spring.jpa.properties.hibernate.generate_statistics=false

# Log em JSON, uma linha por evento (formato Logstash, nativo do Spring Boot 3.4).
# O Alloy lê o stdout do container e manda para o Loki; o JSON carrega o nível,
# o logger e os campos do MDC (requestId, userId, traceId, spanId), que o Grafana
# usa para ligar log, requisição e trace. `docker logs` continua legível com grep.
logging.structured.format.console=logstash

audit.enabled=true
audit.include-get=false